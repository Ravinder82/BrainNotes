name: BrainNotes
options:
  bundleIdPrefix: com.brainnotes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: P8Z36BQ85J
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BrainNotes:
    type: application
    platform: iOS
    sources:
      - path: BrainNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainnotes.app
        PRODUCT_NAME: BrainNotes
        INFOPLIST_FILE: BrainNotes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationScene_Manifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: BrainNotes/BrainNotes.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  BrainNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrainNotesUITests
    dependencies:
      - target: BrainNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainnotes.tests.ui
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  BrainNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrainNotesTests
    dependencies:
      - target: BrainNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainnotes.tests.unit
        GENERATE_INFOPLIST_FILE: YES
