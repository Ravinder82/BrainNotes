name: Confabula
options:
  bundleIdPrefix: com.confabula
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: P8Z36BQ85J
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Confabula:
    type: application
    platform: iOS
    sources:
      - path: Confabula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confabula.app
        PRODUCT_NAME: Confabula
        INFOPLIST_FILE: Confabula/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Confabula/Confabula.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  ConfabulaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConfabulaUITests
    dependencies:
      - target: Confabula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confabula.tests.ui
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ConfabulaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConfabulaTests
    dependencies:
      - target: Confabula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confabula.tests.unit
        GENERATE_INFOPLIST_FILE: YES
